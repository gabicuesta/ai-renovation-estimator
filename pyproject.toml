[project]
name = "ai-renovation-estimator"
version = "0.1.0"
description = "Photos + description → itemised renovation estimate with price ranges, confidence and deterministic checks. Multi-provider, with evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Cuesta" }]
requires-python = ">=3.11"
keywords = ["llm", "vision", "structured-output", "evals", "renovation", "construction", "anthropic", "openai", "gemini"]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
catastro = ["spain-open-data-mcp @ git+https://github.com/gabicuesta/spain-open-data-mcp"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
reno-estimate = "reno_estimator.cli:main"
reno-evals = "reno_estimator.evals:main"

[project.urls]
Homepage = "https://github.com/gabicuesta/ai-renovation-estimator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/reno_estimator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
